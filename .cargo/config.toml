# Cargo build configuration for the assistant workspace.
#
# Intentionally empty of settings. The former host-side target-dir redirect
# (-host-target/) is gone: the runbox engine mounts the workspace read-only and
# exports CARGO_TARGET_DIR to a named working volume, so container processes
# never write to the host tree and the UID-mapping EPERM hazard the redirect
# guarded against no longer exists. Host builds use the default ./target/
# (excluded from the container build context via .dockerignore).
#
# The file itself must exist: the image build's cook stage copies .cargo/ so
# config-driven settings (e.g. a linker reference) resolve during dependency
# cooking — see runbox/runbox.dockerfile.template.
