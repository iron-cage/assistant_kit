- name: ".journal.list"
  namespace: ""
  category: "journal"
  description: "Display a filtered event table from the CLR journal (default: last 50 events)"
  hint: "List journal events"
  version: "0.1.0"
  status: "stable"
  aliases: []
  tags: ["journal", "list"]
  permissions: []
  idempotent: true
  deprecation_message: ""
  http_method_hint: "GET"
  arguments:
    - name: "since"
      kind: "String"
      description: "Show events newer than this duration (e.g. 1h, 7d, 2w)"
      hint: "Time window start"
      optional: true
      default: ""
      validation_rules: []
      aliases: []
      tags: []
    - name: "until"
      kind: "String"
      description: "Show events older than this duration"
      hint: "Time window end"
      optional: true
      default: ""
      validation_rules: []
      aliases: []
      tags: []
    - name: "type"
      kind: "String"
      description: "Filter by event type (execution, credential, gate_wait, retry, timeout, runner_retry, validation_retry, interactive)"
      hint: "Event type filter"
      optional: true
      default: ""
      validation_rules: []
      aliases: []
      tags: []
    - name: "command"
      kind: "String"
      description: "Filter by command name (run, ask, isolated, refresh)"
      hint: "Command filter"
      optional: true
      default: ""
      validation_rules: []
      aliases: []
      tags: []
    - name: "exit"
      kind: "String"
      description: "Filter by exit code"
      hint: "Exit code filter"
      optional: true
      default: ""
      validation_rules: []
      aliases: []
      tags: []
    - name: "model"
      kind: "String"
      description: "Filter by model name substring"
      hint: "Model filter"
      optional: true
      default: ""
      validation_rules: []
      aliases: []
      tags: []
    - name: "limit"
      kind: "Integer"
      description: "Maximum number of events to return (default: 50)"
      hint: "Result limit"
      optional: true
      default: 50
      validation_rules: []
      aliases: []
      tags: []
    - name: "format"
      kind: "String"
      description: "Output format: table (default), json, jsonl, or csv"
      hint: "Output format"
      optional: true
      default: "table"
      validation_rules: []
      aliases: []
      tags: []
    - name: "sort"
      kind: "String"
      description: "Sort key: time (default), cost, duration, exit, model, or command"
      hint: "Sort field"
      optional: true
      default: "time"
      validation_rules: []
      aliases: []
      tags: []
    # Declared String, not Boolean, on purpose: a Boolean-kind argument reaches
    # the routine as "true"/"false" (see `extract_params`), and the documented
    # Boolean type accepts only 0 and 1 (docs/cli/type/08_boolean.md). String
    # keeps the literal the caller typed intact all the way to the parser.
    - name: "reverse"
      kind: "String"
      description: "Reverse the sort into descending order (0 or 1)"
      hint: "Descending"
      optional: true
      default: ""
      validation_rules: []
      aliases: []
      tags: []
    - name: "journal_dir"
      kind: "String"
      description: "Journal directory override (default: ~/.clr/journal/)"
      hint: "Journal dir"
      optional: true
      default: ""
      validation_rules: []
      aliases: []
      tags: []
  examples:
  - .journal.list
  - .journal.list since::1d
  - .journal.list since::1h format::json
  - .journal.list type::execution exit::0
  - .journal.list sort::cost reverse::1 limit::10
  auto_help_enabled: true

