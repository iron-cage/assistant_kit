[package]
name = "claude_runner"
# Fix(BUG-506): default-run selects a canonical binary for bare `cargo run -p claude_runner -- <args>`.
# Root cause: 4 [[bin]] targets (claude_runner/clr/c/fake_claude_control) with no default-run left
#   every undecorated `cargo run` invocation ambiguous — rejected by Cargo before any crate code runs.
# Pitfall: any future [[bin]] target added to this crate must not remove this key; the plain
#   `cargo run -p claude_runner -- <args>` form (used throughout tests/manual/readme.md) depends on it.
default-run = "clr"
version = "1.7.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
homepage.workspace = true
description = "CLI for executing Claude Code via builder pattern; YAML schema constants for command registration"
keywords = [ "claude", "ai", "runner", "cli", "execution" ]
categories = [ "development-tools", "command-line-utilities" ]

[lints]
workspace = true

[lib]
name = "claude_runner"
path = "src/lib.rs"

[[bin]]
name = "claude_runner"
path = "src/main.rs"
required-features = [ "enabled" ]

[[bin]]
name = "clr"
path = "src/bin/clr.rs"
required-features = [ "enabled" ]

[[bin]]
name = "c"
path = "src/bin/c.rs"
required-features = [ "enabled" ]

[[bin]]
name = "fake_claude_control"
path = "tests/fixtures/fake_claude_control.rs"
required-features = [ "enabled" ]

[features]
default = [ "enabled" ]
enabled = [
  "dep:claude_core",
  "dep:claude_runner_core",
  "claude_runner_core/enabled",
  "claude_runner_core/ps_table",
  "claude_core/enabled",
  "dep:claude_storage_core",
  "dep:claude_daemon_core",
  "claude_daemon_core/enabled",
  "dep:claude_pty_core",
  "claude_pty_core/enabled",
  "dep:claude_terminal_core",
  "claude_terminal_core/enabled",
  "dep:claude_session_core",
  "claude_session_core/enabled",
  "dep:claude_topic_core",
  "claude_topic_core/enabled",
  "dep:error_tools",
  "error_tools/enabled",
  "error_tools/error_untyped",
  "dep:unilang",
  "unilang/enabled",
  "dep:data_fmt",
  "data_fmt/enabled",
  # Fix(BUG-537, task/claude_runner registry): pair enabled with terminal_size.
  # Root cause: data_fmt/enabled alone compiles out the TTY width probe —
  #   resolve_terminal_width() hard-falls back to 120 and every table wraps there.
  # Pitfall: $COLUMNS is a non-exported shell variable — it never reaches child
  #   processes and cannot substitute for compiled-in detection.
  "data_fmt/terminal_size",
  "dep:cli_fmt",
  "cli_fmt/cli_help_template",
  "dep:claude_journal",
  "dep:claude_profile_core",
  "claude_profile_core/enabled",
  "dep:serde_json",
  "dep:serde",
  "dep:toml",
]

[dependencies]
claude_core          = { workspace = true, optional = true }
claude_runner_core   = { workspace = true, optional = true }
claude_storage_core  = { workspace = true, optional = true }
claude_daemon_core   = { workspace = true, optional = true }
claude_pty_core      = { workspace = true, optional = true }
claude_terminal_core = { workspace = true, optional = true }
claude_session_core  = { workspace = true, optional = true }
claude_topic_core    = { workspace = true, optional = true }
error_tools          = { workspace = true, optional = true }
unilang              = { workspace = true, optional = true }
data_fmt             = { workspace = true, optional = true }
cli_fmt              = { workspace = true, optional = true }
claude_journal       = { workspace = true, optional = true }
claude_profile_core  = { workspace = true, optional = true }
serde_json           = { workspace = true, optional = true }
serde                = { workspace = true, optional = true, features = [ "std", "derive" ] }
toml                 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
