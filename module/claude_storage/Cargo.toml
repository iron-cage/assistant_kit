[package]
name = "claude_storage"
version = "1.9.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/claude_storage"
description = "CLI tool for exploring Claude Code filesystem storage"
keywords = [ "claude", "storage", "cli", "conversation", "tool" ]
categories = [ "development-tools", "command-line-utilities" ]

[lints]
workspace = true

[dependencies]
# Core library for all storage operations
claude_storage_core = { workspace = true }

# CLI dependencies (optional, only for binary)
# NOTE: Do NOT add phf as direct dep - unilang re-exports phf (0.11) and adding phf 0.13 causes version conflict
unilang = { workspace = true, optional = true, features = [ "approach_yaml_multi_build" ] }
cli_fmt = { workspace = true, optional = true }
# "clock" for local-timezone conversion (format.rs display timestamps), "std" for RFC 3339 parsing
chrono = { workspace = true, optional = true, features = [ "clock", "std" ] }

[dev-dependencies]
tempfile = { workspace = true }
assert_cmd = { workspace = true }

[build-dependencies]
serde_yaml = { workspace = true }
# Fix(BUG-007, assistant registry): "enabled" must be explicit — unilang's multi_yaml
# module is cfg-gated on it; isolated package builds (cargo publish sandbox) fail
# E0433 without it. Lost from the workspace def in commit 2f45fdc2 (2026-07-02);
# every published claude_storage version (1.0.0-1.9.1) carried it.
unilang = { workspace = true, features = [ "enabled", "approach_yaml_multi_build" ] }

[[bin]]
name = "claude_storage"
path = "src/main.rs"
required-features = [ "cli" ]

[[bin]]
name = "clg"
path = "src/bin/clg.rs"
required-features = [ "cli" ]

[features]
default = [ "cli" ]
cli = [ "dep:unilang", "dep:cli_fmt", "dep:chrono", "unilang/enabled", "cli_fmt/cli_help_template" ]
