      optional: true
      validation_rules: []
      aliases: []
      tags: ["filter"]

    - name: "show_topic"
      kind: "Boolean"
      description: "Append each conversation's first user message text (topic) to its line"
      hint: "Show topic"
      optional: true
      default: "0"
      validation_rules: []
      aliases: []
      tags: ["output"]

  examples:
    - ".projects"
    - ".projects scope::around"
    - ".projects scope::relevant"
    - ".projects scope::under path::/home/alice/pro"
    - ".projects scope::global agent::1 min_entries::50"
    - ".projects scope::local session::abc123"
