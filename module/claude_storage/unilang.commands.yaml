      aliases: []
      tags: []

    - name: "entry_type"
      kind: "String"
      description: "Filter by entry type (user, assistant, or all)"
      hint: "Entry type filter"
      optional: true
      validation_rules: []
      aliases: []
      tags: ["filter"]

    - name: "scope"
      kind: "String"
      description: "Project search boundary when project:: is not given (default: global)"
      hint: "Project search scope"
      optional: true
      default: "global"
      validation_rules: []
      aliases: []
      tags: ["scope"]

    - name: "path"
      kind: "String"
      description: "Base path for scope resolution when project:: is not given (default: current directory)"
      hint: "Base path"
      optional: true
      validation_rules: []
      aliases: []
      tags: ["scope", "filter"]

  examples:
    - ".search query::error"
    - ".search query::\"session management\" case_sensitive::1"
    - ".search query::help entry_type::user"
    - ".search query::implement project::abc123"
    - ".search query::error session::abc123 scope::local"
