# Claude Code Storage CLI Commands
# Following unilang v0.35+ schema

- name: ".status"
  namespace: ""
  description: "Show Claude Code storage status and statistics"
  hint: "Show storage status and statistics"
  version: "1.0.0"
  status: "stable"
  aliases: []
  tags: ["storage", "info"]
  permissions: []
  idempotent: true
  deprecation_message: ""
  http_method_hint: "GET"

  arguments:
    - name: "path"
      kind: "String"
      description: "Custom storage path (default: ~/.claude/)"
      hint: "Custom storage path"
      optional: true
      validation_rules: []
      aliases: []
      tags: []

    - name: "show_tokens"
      kind: "Boolean"
      description: "Show token usage statistics (triggers full JSONL parse — slow for large storage)"
      hint: "Show token usage"
      optional: true
      default: "0"
      validation_rules: []
      aliases: []
      tags: []

  examples:
    - ".status"
    - ".status show_tokens::1"
  auto_help_enabled: true

- name: ".list"
  namespace: ""
  description: "List projects or sessions in Claude Code storage"
  hint: "List projects or sessions"
  version: "1.0.0"
  status: "stable"
  aliases: []
  tags: ["storage", "list"]
  permissions: []
  idempotent: true
  deprecation_message: "Deprecated: use .projects instead — detail::projects (project-only view), filter:: (path substring), and ids::/count:: (conversation-ID scripting) cover .list's former capabilities."
  http_method_hint: "GET"

  arguments:
    - name: "type"
      kind: "String"
      description: "Project type filter (uuid, path, or all)"
      hint: "Project type filter"
      optional: true
      default: "all"
      validation_rules: []
      aliases: []
      tags: []

    - name: "show_sessions"
      kind: "Boolean"
      description: "Show sessions for each project (auto-enabled when session filters provided, explicit 0/1 overrides)"
      hint: "Show sessions (auto-detected)"
      optional: true
      default: "0"
      validation_rules: []
      aliases: []
      tags: []

    - name: "path"
      kind: "String"
      description: "Filter projects by path substring (case-insensitive)"
      hint: "Path substring filter"
      optional: true
      validation_rules: []
      aliases: []
      tags: ["filter"]

    - name: "agent"
      kind: "Boolean"
      description: "Filter sessions by type (0=main only, 1=agent only, unset=all, auto-enables session display)"
      hint: "Agent session filter (auto-enables)"
      optional: true
      validation_rules: []
      aliases: []
      tags: ["filter"]

    - name: "min_entries"
      kind: "Integer"
      description: "Filter by minimum entry count (auto-enables session display)"
      hint: "Minimum entries (auto-enables)"
      optional: true
      validation_rules: []
      aliases: []
      tags: ["filter"]

    - name: "session"
      kind: "String"
      description: "Filter sessions by ID substring (case-insensitive, auto-enables session display)"
      hint: "Session ID substring (auto-enables)"
      optional: true
      validation_rules: []
      aliases: []
      tags: ["filter"]

    - name: "project"
      kind: "String"
      description: "Project ID (required for type::conversation)"
      hint: "Project ID"
      optional: true
      validation_rules: []
      aliases: []
      tags: []

    - name: "count"
      kind: "Boolean"
      description: "Output only the count as a bare integer instead of the full list"
      hint: "Count-only mode"
      optional: true
      default: "0"
      validation_rules: []
      aliases: []
      tags: []

    - name: "scope"
      kind: "String"
      description: "Discovery boundary for project listing when type:: is all (default: global)"
      hint: "Project discovery scope"
      optional: true
      default: "global"
      validation_rules: []
      aliases: []
      tags: ["scope"]

  examples:
    - ".list"
    - ".list type::uuid"
    - ".list show_sessions::1"
    - ".list path::assistant"
    - ".list session::commit"
    - ".list agent::1 min_entries::10"
    - ".list path::claude_storage session::default"
    - ".list show_sessions::0 session::commit"
    - ".list type::conversation project::abc123"
    - ".list type::conversation count::1 project::abc123"
    - ".list scope::local"
  auto_help_enabled: true

- name: ".show"
  namespace: ""
  description: "Display session or project details (location-aware, adapts to parameters)"
  hint: "Show session or project"
  version: "1.3.0"
  status: "stable"
  aliases: []
  tags: ["storage", "info"]
  permissions: []
  idempotent: true
  deprecation_message: ""
  http_method_hint: "GET"

  arguments:
    - name: "session_id"
      kind: "String"
      description: "Session ID to display (omit to show project)"
      hint: "Session ID (optional)"
      optional: true
      validation_rules: []
      aliases: []
      tags: []

    - name: "project"
      kind: "String"
      description: "Project ID (default: current directory)"
      hint: "Project ID"
      optional: true
      validation_rules: []
      aliases: []
      tags: []

    - name: "show_entries"
      kind: "Boolean"
      description: "Show all entries in session"
      hint: "Show entries"
      optional: true
      default: "0"
      validation_rules: []
      aliases: []
      tags: []

    - name: "show_metadata"
      kind: "Boolean"
      description: "Show metadata only (old behavior, default shows conversation content)"
      hint: "Metadata only mode"
      optional: true
      default: "0"
      validation_rules: []
      aliases: []
      tags: []

    - name: "show_stat"
      kind: "Boolean"
      description: "Accepted for backward compatibility; has no effect (content mode already shows entry counts and timestamps unconditionally)"
      hint: "No effect (backward compatibility)"
      optional: true
      default: "0"
      validation_rules: []
      aliases: []
      tags: []

    - name: "show_tokens"
      kind: "Boolean"
      description: "Show token usage section (metadata and content modes)"
      hint: "Show token usage"
      optional: true
      default: "0"
      validation_rules: []
      aliases: []
      tags: []

    - name: "scope"
      kind: "String"
      description: "Project search boundary when session_id is given without project:: (default: local)"
      hint: "Project search scope"
      optional: true
      default: "local"
      validation_rules: []
      aliases: []
      tags: ["scope"]

    - name: "path"
      kind: "String"
      description: "Base path for scope resolution when session_id:: given without project:: (default: current directory)"
      hint: "Base path"
      optional: true
      validation_rules: []
      aliases: []
      tags: ["scope", "filter"]

  examples:
    - ".show"
    - ".show session_id::abc123"
    - ".show project::/home/alice/project"
    - ".show session_id::abc123 project::/home/alice/project"
    - ".show session_id::abc123 show_metadata::1"
    - ".show session_id::abc123 show_entries::1"
    - ".show session_id::abc123 show_stat::1"
    - ".show session_id::abc123 show_tokens::1"
    - ".show session_id::abc123 scope::under path::/home/alice/workspace"
  auto_help_enabled: true


