      hint: "Search query"
      optional: false
      validation_rules: []
      aliases: ["q"]
      tags: []

    - name: "project"
      kind: "String"
      description: "Project ID filter (searches only this project)"
      hint: "Project ID"
      optional: true
      validation_rules: []
      aliases: []
      tags: ["filter"]

    - name: "session"
      kind: "String"
      description: "Session ID filter (searches only this session)"
      hint: "Session ID"
      optional: true
      validation_rules: []
