      hint: "Session ID substring filter"
      optional: true
      validation_rules: []
      aliases: []
      tags: ["filter"]

    - name: "agent"
      kind: "Boolean"
      description: "Session type filter (0=main only, 1=agent only, unset=all)"
      hint: "Agent session filter"
      optional: true
      validation_rules: []
      aliases: []
      tags: ["filter"]

    - name: "min_entries"
      kind: "Integer"
      description: "Filter by minimum entry count"
      hint: "Minimum entries filter"
      optional: true
      validation_rules: []
      aliases: []
      tags: ["filter"]

    - name: "ids"
      kind: "Boolean"
      description: "Output raw conversation IDs for project:: (scripting mode)"
      hint: "Conversation-ID scripting mode"
      optional: true
      default: "0"
      validation_rules: []
      aliases: []
      tags: []

    - name: "project"
      kind: "String"
      description: "Project ID; scopes ids:: output (required with ids::1)"
      hint: "Project ID"
      optional: true
      validation_rules: []
      aliases: []
      tags: []

    - name: "count"
      kind: "Boolean"
      description: "With ids::1: output only the count as a bare integer"
