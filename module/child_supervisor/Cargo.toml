[package]
name = "child_supervisor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/child_supervisor"
description = "Generic PTY-child bookkeeping: drained, bounded output and a keyed session table"
keywords = [ "pty", "supervisor", "output", "session" ]
categories = [ "development-tools", "os::unix-apis" ]

[lints]
workspace = true

[dependencies]
claude_pty_core = { workspace = true }
serde = { workspace = true, features = [ "std", "derive" ] }

[features]
default = [ "enabled" ]
enabled = []
full = [ "enabled" ]

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
