[package]
name = "daemon_kit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/daemon_kit"
description = "Generic single-instance Unix-socket daemon skeleton: lock, listener, IPC framing, client, dispatch loop"
keywords = [ "daemon", "ipc", "unix-socket", "single-instance" ]
categories = [ "development-tools", "os::unix-apis" ]

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = [ "std", "derive" ] }
serde_json = { workspace = true }

[features]
default = [ "enabled" ]
enabled = []
full = [ "enabled" ]

[dev-dependencies]
tempfile = { workspace = true }
