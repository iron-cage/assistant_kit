[package]
name = "claude_runner_core"
version = "1.6.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/claude_runner_core"
description = "Claude Code process execution with builder pattern"
keywords = [ "claude", "ai", "runner", "process", "execution" ]
categories = [ "development-tools" ]

[lints]
workspace = true

[features]
default = [ "enabled" ]
full = [ "enabled" ]
enabled = [ "dep:error_tools", "error_tools/enabled", "error_tools/error_untyped", "dep:serde", "dep:serde_json" ]
# Table-rendering helpers for process listings (`render_ps_table`,
# `render_active_sessions_table`). Kept out of `enabled` so plain consumers
# never pull in `data_fmt`.
ps_table = [ "dep:data_fmt", "data_fmt/enabled", "dep:claude_storage_core", "claude_storage_core/enabled" ]

[dependencies]
claude_core = { workspace = true }
claude_storage_core = { workspace = true, optional = true }
error_tools   = { workspace = true, optional = true }
serde         = { workspace = true, optional = true, features = [ "std", "derive" ] }
serde_json    = { workspace = true, optional = true }
tempfile      = { workspace = true }
data_fmt      = { workspace = true, optional = true }

[dev-dependencies]
test_tools = { workspace = true, features = [ "full" ] }

[package.metadata.cargo-udeps.ignore]
development = [ "test_tools" ]
