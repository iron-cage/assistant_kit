[package]
name         = "claude_version"
version = "1.6.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme       = "readme.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/claude_version"
description  = "Claude Code version manager: install, upgrade, and session lifecycle"
keywords     = [ "claude", "ai", "version", "installer", "cli" ]
categories   = [ "development-tools", "command-line-utilities" ]

[lints]
workspace = true

[lib]
name = "claude_version"
path = "src/lib.rs"

[[bin]]
name = "clv"
path = "src/bin/clv.rs"
required-features = [ "enabled" ]

[[bin]]
name = "claude_version"
path = "src/main.rs"
required-features = [ "enabled" ]

[features]
# Binary crate exception: `default = ["enabled"]` activates the CLI binaries.
# Library consumers must opt in via `features = ["enabled"]`; the default
# does not impose transitive dependencies on library-only users.
default = [ "enabled" ]
# Activates all functionality; alias for `enabled` (no additional granular features yet).
full    = [ "enabled" ]
# Master switch: enables all CLI commands, adapters, and output modules.
enabled = [
  "dep:claude_runner_core",
  "claude_runner_core/enabled",
  "claude_runner_core/ps_table",
  "dep:claude_core",
  "claude_core/enabled",
  "dep:claude_version_core",
  "dep:cli_fmt",
  "cli_fmt/cli_help_template",
  "dep:unilang",
  "unilang/enabled",
  "dep:error_tools",
  "error_tools/enabled",
  "dep:data_fmt",
  "data_fmt/enabled",
  # Fix(BUG-537, task/claude_runner registry): pair enabled with terminal_size.
  # Root cause: data_fmt/enabled alone compiles out the TTY width probe —
  #   resolve_terminal_width() hard-falls back to 120 and every table wraps there.
  # Pitfall: $COLUMNS is a non-exported shell variable — it never reaches child
  #   processes and cannot substitute for compiled-in detection.
  "data_fmt/terminal_size",
]

[dependencies]
claude_runner_core  = { workspace = true, optional = true }
claude_core       = { workspace = true, optional = true }
claude_version_core = { workspace = true, optional = true }
claude_storage_core = { workspace = true }
cli_fmt             = { workspace = true, optional = true }
unilang             = { workspace = true, optional = true }
error_tools         = { workspace = true, optional = true }
data_fmt            = { workspace = true, optional = true }

[dev-dependencies]
tempfile            = { workspace = true }
claude_version_core = { workspace = true }
