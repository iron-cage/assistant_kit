[package]
name = "claude_daemon_core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "readme.md"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/claude_daemon_core"
description = "Core library for the single-instance session daemon and its IPC protocol"
keywords = [ "claude", "daemon", "ipc", "session", "unix-socket" ]
categories = [ "development-tools", "os::unix-apis" ]

[lints]
workspace = true

[dependencies]
claude_pty_core = { workspace = true }
claude_session_core = { workspace = true }
claude_core = { workspace = true }
serde = { workspace = true, features = [ "std", "derive" ] }
serde_json = { workspace = true }

[features]
default = [ "enabled" ]
enabled = []
full = [ "enabled" ]

[dev-dependencies]
tempfile = { workspace = true }
