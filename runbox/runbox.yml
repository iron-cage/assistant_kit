# docker image tag — used for -t at build and image lookup at run.
# Shared workspace image: owned and built by THIS config; all module configs consume it.
# Tag is unique to this checkout (claude_memory_test): the retired flat stack shared one
# `workspace_test` tag across sibling assistant_kit checkouts, so a rebake here
# would have swapped the image under unconverted siblings mid-migration.
image: claude_memory_test

# non-root so chmod-000 file-permission tests fail correctly (root bypasses checks)
user: testuser

# script invoked by `.run` and `.live` inside the container (workspace-relative path)
script: verb/test.d/l1

# ── Mounts ────────────────────────────────────────────────────────────────────
mounts:
  - host: ~/.claude
    mode: rw
    check: directory
    commands: [run, live, shell]

# ── Plugins ───────────────────────────────────────────────────────────────────
plugins:
  # The host's own `claude` CLI bind-mounted read-only — real-subprocess control
  # tests run against the host's version and credentials. The working volume is
  # the workspace compilation cache — the engine exports it as CARGO_TARGET_DIR,
  # keeping all build artifacts off the read-only workspace mount.
  - type: binary
    name: claude
    container_path: /usr/local/bin/claude
    working_volume: claude_memory_targets
    working_volume_path: /tmp/claude_memory_targets
    commands: [run, live, shell]

# ── Environment ───────────────────────────────────────────────────────────────
env_commands:
  live:
    # cargo home for registry bind-mounts; offline flag prevents network fetches
    CARGO_HOME: /cargo
    CARGO_NET_OFFLINE: "true"

# ── Build ─────────────────────────────────────────────────────────────────────
# Image-build inputs for this owning config (bake-time only).
build:
  # crate scope for cargo chef cook — which crates' external deps get precompiled
  cmd_scope: "--workspace"
  # union of the retired flat configs' system_packages (root: curl procps jq; modules: curl procps)
  packages: [curl, procps, jq]
  # rustup components added in the final stage — the l1 gate runs clippy in-container
  rust_components: [clippy]
  # single-layer image policy: every rebake is a cold full bake
  squash: true
